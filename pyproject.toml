[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jobhunter_pro"
version = "0.3.1"
description = "JobHunter Pro - 求职自动化 + 手动求职流水线（采集/评分/投递/面试复盘/技能地图）"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "click>=8.0",
    "httpx>=0.27",
    "patchright>=1.58.2",
    "rich>=13.0",
    "pyyaml>=6.0",
    "anthropic>=0.40",
    "markdown2>=2.4",
    "bottle>=0.13",
    "fonttools[woff]>=4.28",
    "openpyxl>=3.1",
    "pypdf>=5.0",
]

[project.optional-dependencies]
pdf = [
    "xhtml2pdf>=0.2.11",
]
asr = [
    "faster-whisper>=1.0",
]

[project.scripts]
jobhunter = "jobhunter_pro.main:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/jobhunter_pro"]
artifacts = [
    "src/jobhunter_pro/browser/runtime/*.mjs",
    "src/jobhunter_pro/browser/runtime/site-patterns/*.md",
    "src/jobhunter_pro/data/*.json",
    "src/jobhunter_pro/data/*.sql",
]

# The frontend build output is no longer tracked in VCS (built on demand),
# so it must be force-included to ship inside the wheel. Run
# `npm ci && npm run build` in src/jobhunter_pro/web/frontend before building.
[tool.hatch.build.targets.wheel.force-include]
"src/jobhunter_pro/web/frontend/dist" = "jobhunter_pro/web/frontend/dist"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
indent-width = 4

[tool.ruff.format]
indent-style = "tab"
