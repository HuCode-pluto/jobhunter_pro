name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/jobhunter_pro/web/frontend/package-lock.json

      # The frontend dist/ is no longer tracked in VCS, so build it before
      # installing the package (force-include in pyproject.toml requires it).
      - name: Build frontend
        working-directory: src/jobhunter_pro/web/frontend
        run: |
          npm ci
          npm run build

      - name: Install package
        run: pip install -e .

      - name: Verify CLI entry point
        run: jobhunter_pro --help

      - name: Verify version output
        run: jobhunter_pro --version

      - name: Run import check
        run: python -c "import jobhunter_pro; print(jobhunter_pro.__version__)"

      - name: Lint with ruff (if available)
        run: |
          pip install ruff
          ruff check src/
        continue-on-error: true

  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/jobhunter_pro/web/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: src/jobhunter_pro/web/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Test greeting workflow and preview
        run: npm test

      - name: Verify build output
        run: test -f dist/index.html
